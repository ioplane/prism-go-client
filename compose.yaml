name: ioplane-prism-go-client
services:
  dev:
    image: localhost/ioplane-prism-go-client:dev
    build:
      context: .
      dockerfile: Containerfile.dev
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:?Set SOURCE_REVISION to the current commit SHA}
    working_dir: /src
    volumes:
      - .:/src:ro,z
      - modules:/cache/modules
      - build:/cache/build
      - lint:/cache/lint
    profiles: [dev]
    command: [bash]
volumes:
  modules:
    name: ioplane-prism-sdk-go-modules
  build:
    name: ioplane-prism-sdk-go-build
  lint:
    name: ioplane-prism-sdk-go-lint

name: SDK quality
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build declared Podman environment
        run: make -f Makefile.dev dev-build
      - name: Check fork contribution governance
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export GOVERNANCE_TITLE="deliberately invalid title"
          export GOVERNANCE_TITLES="$(git log --no-merges --format=%s "$COMMIT_BASE..$COMMIT_HEAD")"
          test -n "$GOVERNANCE_TITLES"
          make -f Makefile.dev governance
      - name: Check module integrity, format, regression, all unit tests and vet
        run: make -f Makefile.dev mod-check fmt-check regression unit-all vet build
      - name: Check vulnerabilities across the complete SDK
        run: make -f Makefile.dev vuln
